<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Pase de lista con QR para el salón de clases" />
    <title>Pase de Lista</title>
    <script>
      // Se aplica el tema antes de que React cargue para evitar el "parpadeo"
      // blanco al abrir la app en modo oscuro. La lógica completa está en
      // src/lib/tema.js; aquí solo se repite lo mínimo.
      try {
        const guardado = localStorage.getItem('tema')
        const oscuro =
          guardado === 'oscuro' ||
          (guardado !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', oscuro)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
